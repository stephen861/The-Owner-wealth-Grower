# Render Blueprint for the FGW leasing agent (and the CRM it lives in).
# One always-on web service with a persistent disk for the SQLite database.
# Secrets are NOT in this file: Render asks for each `sync: false` value when
# you create the Blueprint, and you type them into Render yourself.
services:
  - type: web
    name: fgw-leasing
    runtime: node
    plan: 0.5c-512mb         # smallest paid instance; a persistent disk needs a paid instance
    region: ohio
    branch: leasing-no-screening-staff-login
    buildCommand: npm ci && npm run build
    # The disk only exists at runtime, so the database schema is applied on start.
    startCommand: npm run start:render
    healthCheckPath: /login
    autoDeployTrigger: commit   # a new push to this branch redeploys; with a disk Render stops the old instance first
    disk:
      name: fgw-leasing-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/var/data/fgw-leasing.db
      # Go-live switch. Stays "false" until the owner says go: in dry run the
      # agent only texts the numbers in LEASING_TEST_NUMBERS.
      - key: LEASING_LIVE
        value: "false"
      # Signs the staff login cookie. Render generates a random value.
      - key: LEASING_SESSION_SECRET
        generateValue: true
      # Entered by the owner in Render (never committed):
      - key: STAFF_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FGW_OFFICE_PHONE
        sync: false
      - key: LEASING_TEST_NUMBERS
        sync: false
      # Tour loop: who confirms tour requests by text (e.g. +16145550123).
      # Leave empty and tour requests wait in the staff inbox instead.
      - key: TOUR_CONFIRMER_PHONE
        sync: false
